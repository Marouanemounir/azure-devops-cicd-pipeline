
name: TP3 - Azure CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: tp3-azure-deployment
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-tp3-marouane-mounir
  CONTAINER_APP: ca-tp3-marouane-standard
  ACR_NAME: acrtp3marouanemounir
  IMAGE_NAME: tp3-azure

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Verify application files
        run: |
          test -f Dockerfile
          test -f index.html

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR login server
        id: acr
        run: |
          SERVER=$(az acr show \
            --name "$ACR_NAME" \
            --query loginServer -o tsv)
          echo "server=$SERVER" >> "$GITHUB_OUTPUT"

      - name: Login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ steps.acr.outputs.server }}/$IMAGE_NAME:$GITHUB_SHA" \
            .

      - name: Push Docker image
        run: |
          docker push \
            "${{ steps.acr.outputs.server }}/$IMAGE_NAME:$GITHUB_SHA"

      - name: Deploy Azure Container App
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${{ steps.acr.outputs.server }}/$IMAGE_NAME:$GITHUB_SHA"

      - name: Verify deployed image
        run: |
          EXPECTED="${{ steps.acr.outputs.server }}/$IMAGE_NAME:$GITHUB_SHA"
          ACTUAL=$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" -o tsv)

          test "$EXPECTED" = "$ACTUAL"

          az containerapp revision list \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            -o table
